; ========== 协议格式说明（固化） ==========


;


; 【C端发送协议头 - 24字节】


; 格式: <IbbHIIII (小端序，10个参数)


; 字段: magic(4) + version(1) + cmd(1) + reserved(2) + 


;       cycle_seq(4) + ts_sec(4) + ts_us(4) + data_len(4)


; 说明: C端使用memcpy直接发送结构体，ARM为小端序


;


; 【AI响应包 - 48字节】


; 格式: <IB3sffifIi16s (小端序，10个参数)


; 字段: magic(4) + resp_type(1) + reserved(3) + if_score(4) + 


;       ae_score(4) + cnn_class(4) + cnn_confidence(4) + 


;       latency_ms(4) + result_code(4) + result_desc(16)


; 说明: 响应包大小严格48字节，不得修改


;


; 【波形帧格式】


; 帧头: 0x68 0x36 (2字节)


; 帧长: 4字节 (通常为7182)


; 帧序号: 1字节


; 周波序号: 4字节


; 时间戳: 10字节 (年+月+日+时+分+秒+微秒)


; 通道数据: 7通道 × 256点 × 4字节float = 7168字节


; 总帧大小: 2+4+1+4+10+7168 = 7189字节


; 注意: WS_SINGLE_WAVEFORM_SIZE = 7182 (不含帧头7字节)





; ========== RK3576 部署配置 ==========


;


; 【一键部署】


; PC 端执行: ./scripts/deploy_rk3576.sh


; 或分步执行:


;   1. python scripts/check_npu_env.py --remote    # 检查环境


;   2. python scripts/convert_rknn_models.py        # 转换 RKNN 模型


;   3. python scripts/deploy_rkllm.py --check      # 检查 LLM 环境


;   4. ./scripts/deploy_rk3576.sh --full           # 完整部署


;


; 【模型转换流程】


;   1. 在 PC 端: python scripts/convert_rknn_models.py


;      - 自动创建 CNN1D、AE、iForest 的 ONNX 模型


;      - 使用 rknn-toolkit2 转换为 RKNN 格式


;      - 输出到 models/ 目录


;   2. 部署: ./scripts/deploy_rk3576.sh --model-only


;      - 上传 .rkn 文件到 RK3576 /home/cat/pq_ai/models/


;


; 【LLM 部署流程】


;   1. python scripts/deploy_rkllm.py --check                     # 检查 RKLLM 环境


;   2. python scripts/deploy_rkllm.py --model <model.rkllm>       # 上传 LLM 模型


;   3. python scripts/deploy_rkllm.py --model <model> --cache     # 生成 Prompt Cache


;   4. python scripts/deploy_rkllm.py --start --model <model>     # 启动 LLM 服务


;   5. python scripts/deploy_rkllm.py --test --prompt "测试"       # 测试推理


;


