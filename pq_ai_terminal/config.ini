code_ai_dir = /home/cat/pq_ai_v3/ai

code_comm_dir = /home/cat/pq_ai_v3/comm

code_utils_dir = /home/cat/pq_ai_v3/utils

code_models_dir = /home/cat/pq_ai_v3/models

code_logs_dir = /home/cat/pq_ai_v3/logs

code_data_dir = /home/cat/pq_ai_v3/data

