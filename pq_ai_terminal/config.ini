; [3] T536 终端环境信息

; ============================================================================

[t536_environment]

os_name = Linux 5.10.198 (ARM64)

cpu_info = 全志 T536 (4× Cortex-A55 + E907 RISC-V, 不带 NPU)

architecture = aarch64 (运行 32位 ARM 程序)

adc_info = 钜泉 HT7627S (7 通道 24bit ADC)

memory = 512MB+



; --- 网络配置 ---

[t536_network]

; 以太网 (连接 PC/路由器)

eth_ip = 192.168.14.101

eth_user = csg

eth_password = Iot@csg123

ssh_port = 8888

; USB ECM 虚拟网卡 (连接 RK3576)

usb0_ip = 192.168.100.2

usb0_netmask = 255.255.255.0

usb0_state = UP



; --- 交流采样程序 ---

[t536_sampler]

; 波形采集程序 (ARM 32位)

sampler_dir = /home/csg

wave_export = /home/csg/wave_export_arm

wave_sender = /home/csg/wave_sender_arm

sampler_config = /home/csg/config.ini

; 运行方式 (32位动态链接器)

linker = /lib32/ld-linux-armhf.so.3

library_path = /lib32:/custom/sys/lib/hal_lib/lib32

preload_driver = /custom/sys/lib/hal_lib/lib32/libdrivers.so

; 运行命令示例

wave_export_cmd = /lib32/ld-linux-armhf.so.3 --library-path /lib32:/custom/sys/lib/hal_lib/lib32 ./wave_export_arm --cycles 5 --output wave_data.csv

wave_sender_cmd = /lib32/ld-linux-armhf.so.3 --library-path /lib32:/custom/sys/lib/hal_lib/lib32 ./wave_sender_arm --cycles 5 --server 192.168.100.1 --port 9090



; --- 与 RK3576 通信接口 ---

[t536_rk3576_comm]

; USB ECM TCP 通信

comm_protocol = TCP over USB ECM

rk3576_usb_ip = 192.168.100.1

rk3576_ai_port = 9090

; C端发送协议头 (24字节)

proto_header_format = <IbbHIIII (小端序)

proto_header_magic = 0x57415645

proto_header_size = 24

; AI 响应包 (48字节)

proto_response_format = <IB3sffifIi16s (小端序)

proto_response_size = 48

; 波形帧格式

wave_frame_header = 0x68 0x36 (2字节)

wave_frame_channels = 7

wave_frame_points_per_cycle = 256

wave_frame_data_size = 7168 (7通道 × 256点 × 4字节float)

wave_frame_total_size = 7189 (含帧头7字节)

; 采样参数

sample_rate = 12800

pts_per_cycle = 256

n_channels = 7

nominal_voltage = 220.0

nominal_frequency = 50.0



; --- 电能质量分析报告 ---

[t536_report]

; 报告生成路径

report_dir = /home/csg/reports

wave_data_export = /home/csg/wave_data.csv

; 输出格式

report_format = CSV / JSON

comtrade_export = 支持 (COMTRADE 标准格式)

; MQTT 上报

mqtt_broker = 127.0.0.1

mqtt_port = 1883

mqtt_client_id = pq_terminal_t536



; --- T536 运行服务 ---

[t536_services]

; 所有运行中的服务及进程

sampler_process = wave_sender_arm (波形采集与发送)

ai_client = ai_rpc_logger_arm (AI RPC 日志记录)

mqtt_daemon = mosquitto (本地 MQTT Broker, 端口 1883)

; HAL 库

hal_lib = /custom/sys/lib/hal_lib/lib32/libdrivers.so

hal_lib64 = /custom/sys/lib/hal_lib/lib64/libdrivers.so

; 系统库路径

lib32_dir = /lib32

lib64_dir = /lib64

; 交叉编译信息

cross_compiler = arm-linux-gnueabihf-gcc (GCC Linaro 5.3.1-2016.05)

compile_params = -std=c99 -Wall -O2 -DPLATFORM_LINUX

link_params = -lhd -lrt -lpthread -lm -Wl,-rpath,./lib