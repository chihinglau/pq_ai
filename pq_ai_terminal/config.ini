; PQ AI Terminal - Configuration File
; 本文件为仿真环境配置，真实部署时由平台远程下发
;
; ========== 重要说明 ==========
; T536 是 64 位系统但兼容 32 位库及程序
; 所有ARM程序使用 arm-linux-gnueabihf 工具链编译为 32 位
; 运行时需要使用 /lib32/ld-linux-armhf.so.3 动态链接器

[grid]
nominal_voltage = 220.0
nominal_frequency = 50.0

[sampling]
sample_rate = 12800
pts_per_cycle = 256
n_channels = 7

[thresholds]
voltage_deviation_limit = 7.0
voltage_thd_limit = 5.0
current_thd_limit = 8.0
unbalance_limit = 2.0
frequency_deviation_limit = 0.5
transformer_load_limit = 100.0
line_load_limit = 100.0
power_factor_limit = 0.85

[mqtt]
broker_host = 127.0.0.1
broker_port = 1883
client_id = pq_terminal_01

[ai]
iforest_threshold = 0.6
ae_threshold = 1000000.0
cnn_classes = 7

; ========== 交叉编译服务器配置 ==========
; PC端交叉编译服务器（Ubuntu，用于编译ARM32程序）
; SSH: ssh liuzhixing@192.168.72.128  密码: 123456
[cross_compile]
server_ip = 192.168.72.128
server_port = 22
server_user = liuzhixing
server_password = 123456
; 交叉编译器路径
cross_compiler = /opt/scm/gcc-linaro-5.3.1-2016.05-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf
; 项目根目录
project_root = /home/liuzhixing/pq_ai/pq_ai_terminal

; ========== 交叉编译方法（固化） ==========
;
; 【编译 wave_export_arm】
; 在交叉编译服务器上执行:
; cd /home/liuzhixing/pq_ai/pq_ai_terminal
; /opt/scm/gcc-linaro-5.3.1-2016.05-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc \
;     -o wave_export_arm app/wave_export_arm.c \
;     -I. -I./include \
;     -L./lib -lhd -lrt -lpthread -lm \
;     -Wl,-rpath,./lib \
;     -static-libgcc
;
; 【编译 wave_sender_arm】
; 在交叉编译服务器上执行:
; cd /home/liuzhixing/pq_ai/pq_ai_terminal
; /opt/scm/gcc-linaro-5.3.1-2016.05-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc \
;     -o wave_sender_arm app/wave_sender_arm.c \
;     -I. -I./include \
;     -L./lib -lhd -lrt -lpthread -lm \
;     -Wl,-rpath,./lib \
;     -static-libgcc
;
; 【编译产物打包】
; tar czf wave_app_armhf.tar.gz wave_export_arm wave_sender_arm lib/
;
; 【注意事项】
; 1. 必须使用 32 位工具链 arm-linux-gnueabihf-gcc
; 2. 必须链接 libhd.so（HAL库），不能直接链接 libdrivers.so
; 3. 使用 -static-libgcc 避免依赖 libgcc_s.so
; 4. 使用 -Wl,-rpath,./lib 让程序在当前目录查找库
; 5. 编译后用 file 命令验证: ELF 32-bit LSB executable, ARM
;

; ========== T536 运行方法（固化） ==========
;
; 【在 T536 上运行 wave_export_arm】
; 场景: 导出波形数据为CSV文件
; 
; 1. 上传部署包到T536:
;    scp -P 8888 wave_app_armhf.tar.gz csg@192.168.14.101:~/wave_test/
;
; 2. 在T536上解压:
;    ssh -p 8888 csg@192.168.14.101
;    cd ~/wave_test && tar xzf wave_app_armhf.tar.gz
;
; 3. 使用 32 位动态链接器运行（重要！）:
;    /lib32/ld-linux-armhf.so.3 --library-path /lib32:/custom/sys/lib/hal_lib/lib32 ./wave_export_arm --cycles 5
;
;    参数说明:
;    --cycles N     采集周期数（默认5）
;    --output FILE  输出CSV文件名（默认wave_data.csv）
;
; 4. 查看导出结果:
;    cat wave_data.csv
;
; 【在 T536 上运行 wave_sender_arm】
; 场景: 采集波形并发送到RK3576进行AI推理
;
; 1. 上传部署包到T536:
;    scp -P 8888 wave_app_armhf.tar.gz csg@192.168.14.101:~/wave_sender_test/
;
; 2. 在T536上解压:
;    ssh -p 8888 csg@192.168.14.101
;    cd ~/wave_sender_test && tar xzf wave_app_armhf.tar.gz
;
; 3. 使用 32 位动态链接器运行（重要！）:
;    /lib32/ld-linux-armhf.so.3 --library-path /lib32:/custom/sys/lib/hal_lib/lib32 ./wave_sender_arm --cycles 5 --server 192.168.100.1 --port 9090
;
;    参数说明:
;    --cycles N       采集周期数（默认5）
;    --interval MS    采集间隔毫秒（默认500）
;    --server IP      RK3576服务器IP（默认192.168.100.1）
;    --port PORT      RK3576服务端口（默认9090）
;    --log FILE       日志文件名（默认wave_sender.log）
;
; 4. 查看日志:
;    tail -f wave_sender.log
;
; 【关键说明】
; 1. 必须使用 /lib32/ld-linux-armhf.so.3 动态链接器
; 2. 必须指定 --library-path /lib32:/custom/sys/lib/hal_lib/lib32
; 3. T536与RK3576通过USB ECM直连: T536(192.168.100.2) <-> RK3576(192.168.100.1)
; 4. 如果出现 "libpthread.so.0: wrong ELF class: ELFCLASS64" 错误:
;    需要从交叉编译服务器复制 32 位系统库到 /lib32/
;

; ========== RK3576 AI 服务运行方法（固化） ==========
;
; 【在 RK3576 上启动 AI 推理服务】
; 1. 上传服务脚本:
;    scp app/wave_inference_server_v2.py cat@192.168.137.204:~/ai_inference/wave_inference_server.py
;
; 2. SSH登录RK3576:
;    ssh cat@192.168.137.204
;
; 3. 启动服务（无缓冲模式）:
;    cd ~/ai_inference && PYTHONUNBUFFERED=1 nohup python3 -u wave_inference_server.py --host 192.168.100.1 --port 9090 > ai_server.log 2>&1 &
;
; 4. 查看服务日志:
;    tail -f ai_server.log
;
; 5. 停止服务:
;    pkill -9 -f wave_inference_server
;
; 【服务配置】
; --host 监听地址: RK3576 usb0地址 192.168.100.1
; --port 端口: 9090
;

; ========== 真实硬件部署配置 ==========
[compute_module]
; RK3576 算力模组配置
; enabled=1 时启动本地仿真器模拟 RK3576 行为
; enabled=0 时使用真实硬件，通过 USB ECM 虚拟网卡或以太网连接
enabled = 0

; === 仿真模式（本地回环）===
ip = 127.0.0.1
port = 9090

; === 真实硬件部署配置 ===
; RK3576 算力卡（以太网2，支持公网）
; SSH: ssh cat@192.168.137.204  密码: 123456
rk3576_ip = 192.168.137.204
rk3576_port = 9090
rk3576_user = cat
rk3576_ssh_port = 22

; T536+HT7627S 采样终端
; SSH: ssh -p 8888 csg@192.168.14.101  密码: Iot@csg123
t536_ip = 192.168.14.101
t536_port = 9090
t536_user = csg
t536_ssh_port = 8888

; USB ECM 虚拟网卡配置（T536 与 RK3576 直连使用）
; T536 上 usb0 地址: 192.168.100.2
; RK3576 上 usb0 地址: 192.168.100.1
usb_ecm_ip = 192.168.100.1
usb_ecm_port = 9090

[simulation]
default_scenario = S4
default_cycles = 100

; ========== 协议格式说明（固化） ==========
;
; 【C端发送协议头 - 24字节】
; 格式: <IbbHIIII (小端序，10个参数)
; 字段: magic(4) + version(1) + cmd(1) + reserved(2) + 
;       cycle_seq(4) + ts_sec(4) + ts_us(4) + data_len(4)
; 说明: C端使用memcpy直接发送结构体，ARM为小端序
;
; 【AI响应包 - 48字节】
; 格式: <IB3sffifIi16s (小端序，10个参数)
; 字段: magic(4) + resp_type(1) + reserved(3) + if_score(4) + 
;       ae_score(4) + cnn_class(4) + cnn_confidence(4) + 
;       latency_ms(4) + result_code(4) + result_desc(16)
; 说明: 响应包大小严格48字节，不得修改
;
; 【波形帧格式】
; 帧头: 0x68 0x36 (2字节)
; 帧长: 4字节 (通常为7182)
; 帧序号: 1字节
; 周波序号: 4字节
; 时间戳: 10字节 (年+月+日+时+分+秒+微秒)
; 通道数据: 7通道 × 256点 × 4字节float = 7168字节
; 总帧大小: 2+4+1+4+10+7168 = 7189字节
; 注意: WS_SINGLE_WAVEFORM_SIZE = 7182 (不含帧头7字节)
