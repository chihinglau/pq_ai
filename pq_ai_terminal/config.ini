; 【服务验证】


;   curl http://192.168.100.1:9090/status


;   tail -f /home/cat/pq_ai/logs/ai_server*.log


;   pgrep -f wave_inference_server_v3


;


; 【故障排查】


;   1. NPU 不可用 → 检查 librknnrt.so 是否存在, 回退至 CPU 模式


;   2. 模型加载失败 → 运行 check_npu_env.py 检查模型文件


;   3. USB 连接断开 → 检查 RNDIS 连接, ping 192.168.100.2


;   4. 服务无响应 → 检查进程状态和日志


;   5. LLM 不可用 → 系统自动使用模拟响应


