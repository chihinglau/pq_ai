; PQ AI Terminal - Configuration File
; 本文件为仿真环境配置，真实部署时由平台远程下发

[grid]
nominal_voltage = 220.0
nominal_frequency = 50.0

[sampling]
sample_rate = 12800
pts_per_cycle = 256
n_channels = 7

[thresholds]
voltage_deviation_limit = 7.0
voltage_thd_limit = 5.0
current_thd_limit = 8.0
unbalance_limit = 2.0
frequency_deviation_limit = 0.5
transformer_load_limit = 100.0
line_load_limit = 100.0
power_factor_limit = 0.85

[mqtt]
broker_host = 127.0.0.1
broker_port = 1883
client_id = pq_terminal_01

[ai]
iforest_threshold = 0.6
ae_threshold = 1000000.0
cnn_classes = 7

[compute_module]
; RK3576 算力模组配置
; enabled=1 时启动本地仿真器模拟 RK3576 行为
; 真实部署时 enabled=0，ip 设为 USB ECM 虚拟网卡地址（如 169.254.1.2）
enabled = 1
ip = 127.0.0.1
port = 9090

[simulation]
default_scenario = S4
default_cycles = 100
