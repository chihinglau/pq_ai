; ========== 交叉编译方法（固化） ==========


;


; 【编译 wave_export_arm】


; 在交叉编译服务器上执行:


; cd /home/liuzhixing/pq_ai/pq_ai_terminal


; /opt/scm/gcc-linaro-5.3.1-2016.05-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc \


;     -o wave_export_arm app/wave_export_arm.c \


;     -I. -I./include \


;     -L./lib -lhd -lrt -lpthread -lm \


;     -Wl,-rpath,./lib \


;     -static-libgcc


;


; 【编译 wave_sender_arm】


; 在交叉编译服务器上执行:


; cd /home/liuzhixing/pq_ai/pq_ai_terminal


; /opt/scm/gcc-linaro-5.3.1-2016.05-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc \


;     -o wave_sender_arm app/wave_sender_arm.c \


;     -I. -I./include \


;     -L./lib -lhd -lrt -lpthread -lm \


;     -Wl,-rpath,./lib \


;     -static-libgcc


;


; 【编译产物打包】


; tar czf wave_app_armhf.tar.gz wave_export_arm wave_sender_arm lib/


;


; 【注意事项】


; 1. 必须使用 32 位工具链 arm-linux-gnueabihf-gcc


; 2. 必须链接 libhd.so（HAL库），不能直接链接 libdrivers.so


; 3. 使用 -static-libgcc 避免依赖 libgcc_s.so


; 4. 使用 -Wl,-rpath,./lib 让程序在当前目录查找库


; 5. 编译后用 file 命令验证: ELF 32-bit LSB executable, ARM


;





; ========== T536 运行方法（固化） ==========


;


; 【在 T536 上运行 wave_export_arm】


; 场景: 导出波形数据为CSV文件


; 


; 1. 上传部署包到T536:


;    scp -P 8888 wave_app_armhf.tar.gz csg@192.168.14.101:~/wave_test/


;


; 2. 在T536上解压:


;    ssh -p 8888 csg@192.168.14.101


;    cd ~/wave_test && tar xzf wave_app_armhf.tar.gz


;


; 3. 使用 32 位动态链接器运行（重要！）:


;    /lib32/ld-linux-armhf.so.3 --library-path /lib32:/custom/sys/lib/hal_lib/lib32 ./wave_export_arm --cycles 5


;


;    参数说明:


;    --cycles N     采集周期数（默认5）


;    --output FILE  输出CSV文件名（默认wave_data.csv）


;


; 4. 查看导出结果:


;    cat wave_data.csv


;


; 【在 T536 上运行 wave_sender_arm】


; 场景: 采集波形并发送到RK3576进行AI推理


;


; 1. 上传部署包到T536:


;    scp -P 8888 wave_app_armhf.tar.gz csg@192.168.14.101:~/wave_sender_test/


;


; 2. 在T536上解压:


;    ssh -p 8888 csg@192.168.14.101


;    cd ~/wave_sender_test && tar xzf wave_app_armhf.tar.gz


;


; 3. 使用 32 位动态链接器运行（重要！）:


;    /lib32/ld-linux-armhf.so.3 --library-path /lib32:/custom/sys/lib/hal_lib/lib32 ./wave_sender_arm --cycles 5 --server 192.168.100.1 --port 9090


;


;    参数说明:


;    --cycles N       采集周期数（默认5）


;    --interval MS    采集间隔毫秒（默认500）


;    --server IP      RK3576服务器IP（默认192.168.100.1）


;    --port PORT      RK3576服务端口（默认9090）


;    --log FILE       日志文件名（默认wave_sender.log）


;


; 4. 查看日志:


;    tail -f wave_sender.log


;


; 【关键说明】


; 1. 必须使用 /lib32/ld-linux-armhf.so.3 动态链接器


; 2. 必须指定 --library-path /lib32:/custom/sys/lib/hal_lib/lib32


; 3. T536与RK3576通过USB ECM直连: T536(192.168.100.2) <-> RK3576(192.168.100.1)


; 4. 如果出现 "libpthread.so.0: wrong ELF class: ELFCLASS64" 错误:


;    需要从交叉编译服务器复制 32 位系统库到 /lib32/


;





