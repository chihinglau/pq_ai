; PQ AI Terminal - Configuration File
; 本文件为仿真环境配置，真实部署时由平台远程下发

[grid]
nominal_voltage = 220.0
nominal_frequency = 50.0

[sampling]
sample_rate = 12800
pts_per_cycle = 256
n_channels = 7

[thresholds]
voltage_deviation_limit = 7.0
voltage_thd_limit = 5.0
current_thd_limit = 8.0
unbalance_limit = 2.0
frequency_deviation_limit = 0.5
transformer_load_limit = 100.0
line_load_limit = 100.0
power_factor_limit = 0.85

[mqtt]
broker_host = 127.0.0.1
broker_port = 1883
client_id = pq_terminal_01

[ai]
iforest_threshold = 0.6
ae_threshold = 1000000.0
cnn_classes = 7

[compute_module]
; RK3576 算力模组配置
; enabled=1 时启动本地仿真器模拟 RK3576 行为
; enabled=0 时使用真实硬件，通过 USB ECM 虚拟网卡或以太网连接
enabled = 1

; === 仿真模式（本地回环）===
ip = 127.0.0.1
port = 9090

; === 真实硬件部署配置 ===
; RK3576 算力卡（以太网2，支持公网）
; SSH: ssh cat@192.168.137.204  密码: 123456
rk3576_ip = 192.168.137.204
rk3576_port = 9090
rk3576_user = cat
rk3576_ssh_port = 22

; T536+HT7627S 采样终端（以太网5，仅本地通信）
; SSH: ssh -P 8888 csg@192.168.14.101  密码: Iot@csg123
t536_ip = 192.168.14.101
t536_port = 9090
t536_user = csg
t536_ssh_port = 8888

; USB ECM 虚拟网卡配置（T536 与 RK3576 直连时使用）
; usb_ecm_ip = 169.254.1.2   ; T536 侧 USB ECM 地址
; usb_ecm_port = 9090

[simulation]
default_scenario = S4
default_cycles = 100
