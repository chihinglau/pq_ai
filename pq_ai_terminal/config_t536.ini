; PQ AI Terminal - T536 真实硬件模式配置
; T536 + HT7627S 采样终端 + RK3576 算力模组 (USB ECM)

; 算力模组配置 (RK3576)
compute_module.enabled = 1
compute_module.ip = 192.168.100.1
compute_module.port = 9090

; MQTT 配置 (T536 本地)
mqtt.broker_host = 127.0.0.1
mqtt.broker_port = 1883
mqtt.client_id = pq_terminal_t536

; PQ 阈值配置
thresholds.voltage_deviation_limit = 7.0
thresholds.voltage_thd_limit = 5.0
thresholds.current_thd_limit = 8.0
thresholds.unbalance_limit = 2.0
thresholds.frequency_deviation_limit = 0.5
thresholds.transformer_load_limit = 100.0
thresholds.line_load_limit = 100.0
thresholds.power_factor_limit = 0.85

; 运行模式
; scenario: S1(基准负载), S2(EV充电), S3(分布式光伏), S4(EV+PV耦合), S5(极端场景)
; cycles: 模拟周期数
